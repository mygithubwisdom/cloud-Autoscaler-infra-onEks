{{- if .Values.serviceAccount.create }}
{{- if .Values.secrets.enabled }}
{{- $_ := required "serviceAccount.roleArn is required when secrets.enabled=true and serviceAccount.create=true" .Values.serviceAccount.roleArn }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
