replicaCount: 2

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

containerPort: 8080

env:
  PORT: "8080"

database:
  host: ""
  port: 5432
  name: "appdb"
  user: ""

probes:
  startup:
    path: /health
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 12
    timeoutSeconds: 2
  liveness:
    path: /health
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  readiness:
    path: /ready
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 3

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

deployment:
  maxSurge: 1
  maxUnavailable: 0
  terminationGracePeriodSeconds: 30

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  enabled: true
  minAvailable: 1

ingress:
  enabled: false
  className: alb
  host: ""
  certificateArn: ""
  securityGroupId: ""

  idleTimeoutSeconds: 60

  accessLogs:
    enabled: false
    bucket: ""
    prefix: alb

serviceAccount:
  create: true
  name: task-api
  roleArn: ""

secrets:
  enabled: false
  applicationDbSecretArn: ""
