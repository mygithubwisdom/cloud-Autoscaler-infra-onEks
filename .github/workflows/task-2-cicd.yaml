
name: Task 2 - Test, Scan, and Publish

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-2-cicd-image-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: assessment-api

jobs:
  test-scan-publish:
    name: Test, scan, and publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: task-2-cicd

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.10"
          cache-dependency-path: task-2-cicd/go.mod

      - name: Run unit tests
        run: go test -race ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: task-4/bootstrap/requirements.txt

      - name: Install PostgreSQL bootstrap dependencies
        working-directory: task-4/bootstrap
        run: |
          python -m pip install -r requirements.txt
      - name: run PostgreSQL bootstrap unit tests
        working-directory: task-4/bootstrap
        run: python -m unittest discover -s . -p "test_*.py" -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: task-2-cicd
          file: task-2-cicd/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build PostgreSQL bootstrap image
        uses: docker/build-push-action@v7
        with:
          context: task-4/bootstrap
          file: task-4/bootstrap/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: assessment-db-bootstrap:${{ github.sha }}

      - name: Scan PostgreSQL bootstrap image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: assessment-db-bootstrap:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Configure AWS credentials through OIDC
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-actions-ecr-${{ github.run_id }}

      - name: Log in to Amazon ECR
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push verified image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
               --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" \
            > /dev/null 2> ecr-error.txt; then
            echo "Application image $IMAGE_TAG already exists. Skipping push."
          elif grep -q 'ImageNotFoundException' ecr-error.txt; then
            docker tag "$IMAGE_NAME:$IMAGE_TAG" "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          else
            echo "ECR lookup failed:"
            cat ecr-error.txt
            exit 1
          fi
      - name: Tag and push verified PostgreSQL bootstrap image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          BOOTSTRAP_ECR_REPOSITORY: ${{ vars.BOOTSTRAP_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
               --repository-name "$BOOTSTRAP_ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" \
            > /dev/null 2> ecr-error.txt; then
            echo "Bootstrap image  $IMAGE_TAG already exists. Skipping push."
          elif grep -q 'ImageNotFoundException' ecr-error.txt; then
            docker tag "assessment-db-bootstrap:$IMAGE_TAG" "$ECR_REGISTRY/$BOOTSTRAP_ECR_REPOSITORY:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$BOOTSTRAP_ECR_REPOSITORY:$IMAGE_TAG"
          else
            echo "ECR lookup failed:"
            cat ecr-error.txt
            exit 1
          fi
